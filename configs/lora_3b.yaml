# Research experiment only. Does not change configs/lora.yaml or the 0.5B baseline.
lora:
  base_model: Qwen/Qwen2.5-3B-Instruct
  model_revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
  strategy: sequential
  model_dtype: float16
  quantization: nf4_double_quant
  years: [2022, 2023, 2024, 2025, 2026]
  seed: 42
  max_seq_length: 512
  max_new_tokens: 160
  learning_rate: 0.0001
  epochs: 2
  train_batch_size: 1
  gradient_accumulation_steps: 8
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  minimum_total_qa: 200
  minimum_qa_per_year: 30
  minimum_gpu_gib: 12
  benchmark: data/qa_benchmark/benchmark.jsonl
