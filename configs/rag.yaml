# RAG config (branch feature/rag-versioned). Paths are relative to the repo root.
# Chunks exported by: python -m src.versioning.cli export-chunks --include-unreviewed --max-chars 1500
#   rag_chunks.jsonl        reviewed documents only (tracked in Git; works on clean clone)
#   rag_chunks_draft.jsonl  includes unreviewed documents (generated via export-chunks --include-unreviewed)
chunks_file: data/versioning/rag_chunks.jsonl
reviewed_documents_file: data/versioning/reviewed_documents.jsonl

documents_file: data/versioning/documents.jsonl   # auto-built from data/raw/uet/markdown if absent

# Hybrid chunking: documents with at least min_articles "Dieu" are split by article,
# the rest keep the character-based chunks exported by the data team.
chunk_by_article: true
min_articles: 3
max_article_chars: 2000

vector_db_path: data/vectordb
collection: regulations

# Multilingual model supporting up to 8192 tokens for full Vietnamese legal articles.
# Lightweight fallback for quick CPU tests: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
embedding_model: BAAI/bge-m3

top_k: 5

# A question with a single year (e.g. "nam 2023"): which academic year?
#   start: 2023 -> 2023-2024     end: 2023 -> 2022-2023
single_year_means: start

# Curricula governance (31 files tracked in data/raw/uet/curricula/manifest.json)
curricula:
  respect_retrieval_eligible: false   # true = only index curricula marked retrieval_eligible=true
  warn_unreviewed: true               # append a concise disclaimer when answering from unreviewed curricula

# How the answer is written from the retrieved passages (RAG needs no training):
#   none      print the retrieved passages only (for checking retrieval)
#   local     model on this machine via transformers, no API key.
#             Qwen/Qwen2.5-1.5B-Instruct runs on CPU (slow, about 1 min per answer); 3B needs more RAM
#   anthropic API (pip install anthropic; set ANTHROPIC_API_KEY); change model to the one the team picks
llm:
  provider: local
  model: Qwen/Qwen2.5-1.5B-Instruct
  max_new_tokens: 400
  max_hits: 4               # passages given to the model
  max_context_chars: 2000   # matches max_article_chars so full articles are not truncated
